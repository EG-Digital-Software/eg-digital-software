name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    # The Static Web App authorises deployments via GitHub OIDC, so the
    # deployment token alone is rejected — the job must be able to mint an
    # id-token for the deploy step.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Root package.json declares npm workspaces, and its lockfile was generated
      # on Windows (win32-only rollup/esbuild binaries). Installing from workspace
      # root on Linux therefore misses @rollup/rollup-linux-x64-gnu. Detach the
      # package so npm uses this folder's own complete lockfile.
      - name: Detach from workspace root
        run: rm -f package.json package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: EG Digital
        run: npm run build

      # github-script already injects `core`; redeclaring it is a syntax error.
      - name: Get id token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: 'frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

  close-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
