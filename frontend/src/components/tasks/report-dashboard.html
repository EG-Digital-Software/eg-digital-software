<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report · EG Eloma</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f3237;--strong:#14171c;--t2:#757980;--t3:#a1a4a9;--line:#ededee;--soft:#fafafb;--navy:#0b213a;--accent:#2db88c;--accent-soft:#e9f7f2;--good:#1f9a72;--bad:#c2522d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:#f3f4f6;border:0;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:500;color:var(--t2)}
.tab:hover{color:var(--strong)}
.tab.active{background:var(--navy);color:#fff}
.placeholder{border:1px dashed #dfe1e4;border-radius:12px;padding:80px 20px;text-align:center;color:var(--t2)}
.placeholder b{display:block;color:var(--strong);font-size:16px;margin-bottom:6px}

/* header */
.report-head{position:relative;border-radius:12px;background:linear-gradient(#fcfdfd,#f1f7f4);border:1px solid #e6efeb;padding:32px 36px 110px}
.curve-wrap{position:absolute;left:0;right:0;bottom:0;height:100px;overflow:hidden;border-radius:0 0 12px 12px;pointer-events:none}
.curve{width:100%;height:100%;display:block}
.rh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.brand img{height:34px}
.brand .wm{display:flex;flex-direction:column;line-height:1.15}.brand .wm b{font-size:17px;font-weight:500;letter-spacing:.22em;color:var(--navy)}.brand .wm small{font-size:9.5px;font-weight:500;letter-spacing:.2em;color:var(--t2);margin-top:3px}
footer .brand{margin:0}footer .brand img{height:20px}footer .brand .wm b{font-size:12px}footer .brand .wm small{font-size:8px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.report-head h1{font-size:38px;font-weight:600;color:var(--strong);letter-spacing:-.02em;margin:8px 0 6px}
.meta{font-size:13px;color:var(--t2)}
.meta span+span::before{content:'·';margin:0 8px;color:var(--t3)}
.rh-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;transition:background .15s,border-color .15s;white-space:nowrap}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:#163254}
.btn.outline{background:#fff;border-color:#e2e4e7;color:var(--strong)}.btn.outline:hover{border-color:#c9ccd1}
.btn.sm{padding:7px 12px;font-size:12.5px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink);background:none;border:0;padding:6px 4px}
.switch i{width:34px;height:20px;border-radius:20px;background:#d5d8dc;position:relative;transition:.2s;flex-shrink:0}
.switch i::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch[aria-pressed=true] i{background:var(--accent)}
.switch[aria-pressed=true] i::after{left:16px}
.switch:disabled{opacity:.45;cursor:not-allowed}
.headline{display:grid;grid-template-columns:repeat(4,max-content);margin-top:44px;position:relative;z-index:1}
.hl{padding:0 32px}.hl:first-child{padding-left:0}
.hl+.hl{border-left:1px solid #e2e4e7}
.hl b{display:block;font-size:30px;font-weight:500;color:var(--strong);letter-spacing:-.02em}
.hl b small{font-size:16px;margin-left:2px}
.hl span{font-size:12px;color:var(--t2)}

/* date range picker */
.dr{position:relative}
.dr .btn .chev{width:12px;height:12px;opacity:.6}
.drpop{position:absolute;left:0;top:calc(100% + 8px);background:#fff;border:1px solid #e6e8eb;border-radius:12px;box-shadow:0 12px 32px rgba(11,33,58,.12);display:none;grid-template-columns:200px 250px;z-index:30;overflow:hidden}
.drpop.open{display:grid}
.presets{padding:8px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.presets button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink)}
.presets button small{display:block;font-size:11px;color:var(--t3);font-weight:500;margin-top:1px}
.presets button:hover{background:var(--soft)}
.presets button.on{background:var(--accent-soft);color:var(--navy)}
.custom{padding:16px;display:flex;flex-direction:column;gap:12px}
.custom h5{font-size:12px;font-weight:700;color:var(--strong)}
.custom label{font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:5px}
.custom input{border:1px solid #e2e4e7;border-radius:7px;padding:8px 10px;font:500 13px Manrope,sans-serif;color:var(--strong)}
.custom input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.custom .err{font-size:12px;color:var(--bad);min-height:16px}
.custom .hint{font-size:11px;color:var(--t3);line-height:1.4;margin:0}

/* data strip */
.datastrip{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--t2)}
.datastrip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.datastrip b{color:var(--ink);font-weight:600}
.datastrip .acts{display:flex;gap:8px;flex-wrap:wrap}
.team{font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--accent-soft);color:var(--good);padding:2px 6px;border-radius:4px;margin-left:2px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loading section,.loading .report-head{opacity:.45;transition:opacity .2s}

/* sections */
section{padding-top:72px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sh h2{font-size:26px;font-weight:600;color:var(--strong);letter-spacing:-.015em}
.sh p{font-size:13px;color:var(--t2);margin-top:5px}
.filter{display:flex;background:#f3f4f6;border-radius:8px;padding:3px;flex-wrap:wrap}
.filter button{border:0;background:none;font-size:13px;font-weight:500;padding:7px 14px;border-radius:6px;color:var(--t2)}
.filter button:hover{color:var(--strong)}
.filter button.on{background:#fff;color:var(--strong);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stat{padding:26px 22px 26px 0}
.stat+.stat{padding-left:22px;border-left:1px solid var(--line)}
.stat .l{font-size:13px;color:var(--t2)}
.stat .v{font-size:36px;font-weight:300;color:var(--strong);letter-spacing:-.02em;margin:8px 0 6px}
.stat .v small{font-size:18px;margin-left:2px}
.stat .c{font-size:13px;color:var(--t2);min-height:18px}
.c .up{color:var(--good);font-weight:600}.c .down{color:var(--bad);font-weight:600}
.no-compare .cmp{visibility:hidden}
.panel{background:var(--soft);border:1px solid #f0f0f1;border-radius:10px;padding:28px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h3{font-size:16px;font-weight:600;color:var(--strong)}
.ph span{font-size:12px;color:var(--t2)}
.legend{display:flex;gap:20px;font-size:12px;color:var(--t2);margin-top:12px}
.legend i{display:inline-block;width:16px;border-top:2px solid var(--accent);margin-right:8px;vertical-align:middle}
.legend .prev i{border-top:2px dashed #b9c2cc}
.goal{padding:15px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goal .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
.goal .t span{color:var(--t2)}
.goal .bar{height:4px;background:#ebecee;border-radius:2px}
.goal .bar b{display:block;height:100%;background:var(--accent);border-radius:2px}
.goal.done .bar b{background:var(--navy)}
.goalnote{font-size:11.5px;color:var(--t3);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--t2);padding:0 8px 12px 0;border-bottom:1px solid var(--line)}
td{padding:18px 8px 18px 0;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right}td.n{font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--accent-soft)!important}
.mono{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);font-size:10px;font-weight:700;margin-right:12px;vertical-align:middle;color:var(--navy)}
.status{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;background:#eaf6ef;color:var(--good)}
.status.off{background:#f1f2f4;color:var(--t2)}
.posts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.post{background:none;border:0;text-align:left;padding:0;color:inherit}
.post .img{aspect-ratio:1/1;border-radius:8px;background:linear-gradient(160deg,#f6f6f7,#e9eaec);position:relative;transition:transform .2s}
.post:hover .img{transform:translateY(-2px)}
.post .img span{position:absolute;left:12px;top:12px;font-size:11px;font-weight:600;background:#fff;padding:4px 9px;border-radius:5px}
.post .img svg{position:absolute;inset:0;margin:auto;width:42px;height:42px;opacity:.35}
.post h4{font-size:14px;font-weight:600;color:var(--strong);margin:12px 0 4px}
.post p{font-size:12px;color:var(--t2)}
.empty{grid-column:1/-1;color:var(--t2);padding:30px 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.vs .panel h3{font-size:20px;font-weight:600;color:var(--strong)}
.vs .panel .sp{font-size:13px;color:var(--t2);margin-top:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;row-gap:22px;margin-top:24px}
.kv b{display:block;font-size:24px;font-weight:400;color:var(--strong)}
.kv span{font-size:12px;color:var(--t2)}
.kv .lead::after{content:'Ahead';font-size:10px;font-weight:600;color:var(--good);background:var(--accent-soft);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:5px}
.pacing{margin-top:22px;font-size:12px;color:var(--t2)}
.pacing .bar{height:4px;background:#ebecee;border-radius:2px;margin-top:8px}.pacing .bar b{display:block;height:100%;background:var(--accent);border-radius:2px;max-width:100%}
.dim{opacity:.35}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:48px;border-top:1px solid var(--line);padding-top:32px}
.notes p{font-size:18px;line-height:1.6;font-weight:400;color:var(--ink)}
.notes ol{list-style:none;counter-reset:n}
.notes li{counter-increment:n;display:flex;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.notes li::before{content:counter(n,decimal-leading-zero);color:var(--t3);font-size:12px;font-weight:600;padding-top:2px}
.sig{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:13px;color:var(--t2)}
.sig i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);padding:64px 0 24px}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(11,33,58,.28);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(720px,100%);background:#fff;z-index:45;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(11,33,58,.08)}
.drawer.open{transform:none}
.dh{padding:22px 24px 0;border-bottom:1px solid var(--line)}
.dh .t{display:flex;justify-content:space-between;align-items:flex-start}
.dh h3{font-size:18px;font-weight:600;color:var(--strong)}
.dh p{font-size:12.5px;color:var(--t2);margin-top:4px}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--t2)}
.dtabs{display:flex;gap:20px;margin-top:18px}
.dtabs button{border:0;background:none;font-size:13px;font-weight:600;color:var(--t2);padding:10px 0;border-bottom:2px solid transparent}
.dtabs button.on{color:var(--strong);border-color:var(--accent)}
.db{flex:1;overflow:auto;padding:22px 24px}
.db h4{font-size:13px;font-weight:700;color:var(--strong);margin:4px 0 10px}
.db h4:not(:first-child){margin-top:26px}
.ft{width:100%;border-collapse:collapse;font-size:12.5px}
.ft th{font-size:11px;padding:0 4px 8px;border-bottom:0;text-align:right;white-space:nowrap}.ft th:first-child{text-align:left}
.ft td{padding:4px;border-bottom:0}
.ft td:first-child{font-weight:600;color:var(--strong);white-space:nowrap;padding-right:10px}
.ft input{width:100%;min-width:84px;border:1px solid #e2e4e7;border-radius:6px;padding:7px 8px;font:500 12.5px Manrope,sans-serif;text-align:right;color:var(--strong)}
.ft input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hint{font-size:12px;color:var(--t2);margin-top:10px;line-height:1.5}
.drop{display:block;border:1.5px dashed #cfd5da;border-radius:10px;padding:34px 20px;text-align:center;color:var(--t2);font-size:13px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;color:var(--strong);font-size:14px;margin-bottom:4px}
.tpl{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msg{margin-top:14px;font-size:12.5px;padding:10px 12px;border-radius:8px;display:none}
.msg.ok{display:block;background:var(--accent-soft);color:var(--good)}.msg.err{display:block;background:#fdf0eb;color:var(--bad)}
.steps{margin-top:22px;font-size:12.5px;color:var(--t2);line-height:1.7;padding-left:18px}
.df{border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.df .r{display:flex;gap:8px}
.linkbtn{border:0;background:none;color:var(--t2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* view switch + team insights */
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px}
.views{display:flex;background:#f3f4f6;border-radius:10px;padding:4px}
.views button{border:0;background:none;padding:9px 18px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:8px}
.views button.on{background:#fff;color:var(--strong);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.views .cnt{font-size:11px;font-weight:700;background:#fdf0eb;color:var(--bad);border-radius:10px;padding:1px 7px}
.viewnote{font-size:12px;color:var(--t2)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:12px}
.sum{border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.sum b{display:block;font-size:30px;font-weight:500;color:var(--strong)}
.sum span{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:7px}
.sum span i{width:8px;height:8px;border-radius:50%}
.sum.prio{background:var(--soft)}
.sum.prio h5{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.sum.prio p{font-size:15px;color:var(--strong);font-weight:500;margin-top:8px;line-height:1.45}
.isec{padding-top:44px}
.isec h3{font-size:18px;font-weight:600;color:var(--strong);margin-bottom:4px;display:flex;align-items:center;gap:10px}
.isec h3 i{width:9px;height:9px;border-radius:50%}
.isec>p{font-size:12.5px;color:var(--t2);margin-bottom:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.icard{border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--sev)}
.icard.bad{--sev:#c2522d;--sevbg:#fdf0eb}.icard.warn{--sev:#c98a1b;--sevbg:#fdf5e4}.icard.opp{--sev:#0b213a;--sevbg:#eef1f5}.icard.good{--sev:#2db88c;--sevbg:#e9f7f2}
.icard.closed{opacity:.55}
.ic-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sevpill{font-size:11px;font-weight:700;color:var(--sev);background:var(--sevbg);padding:3px 9px;border-radius:5px}
.area{font-size:12px;color:var(--t2);font-weight:600}
.icard h4{font-size:15.5px;font-weight:600;color:var(--strong);line-height:1.35}
.ev{display:flex;flex-wrap:wrap;gap:8px}
.ev span{font-size:12px;background:var(--soft);border:1px solid #f0f0f1;border-radius:6px;padding:5px 9px;color:var(--t2)}
.ev b{color:var(--strong);font-weight:600}
.why{font-size:13px;color:var(--ink);line-height:1.55}
.why b{font-weight:600}
.causes{font-size:12.5px;color:var(--t2);line-height:1.6;padding-left:16px}
.lbl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.todo{display:flex;flex-direction:column;gap:6px}
.todo label{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink);cursor:pointer}
.todo input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
.todo label.done span{text-decoration:line-through;color:var(--t3)}
.ic-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.ic-foot select{border:1px solid #e2e4e7;border-radius:7px;padding:6px 8px;font:500 12.5px Manrope,sans-serif;color:var(--strong);background:#fff}
.ic-foot .prog{margin-left:auto;font-size:12px;color:var(--t2)}
.keep{font-size:13px;color:var(--ink);line-height:1.6;padding-left:16px}
.scard td,.scard th{padding:12px 8px 12px 0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px}
.chip.bad{background:#fdf0eb;color:#c2522d}.chip.warn{background:#fdf5e4;color:#a87213}.chip.good{background:#e9f7f2;color:#1f9a72}.chip.neu{background:#f3f4f6;color:var(--t2)}
.plan td{vertical-align:top}
.plan td:first-child{width:28px}
.plan .src{display:block;font-size:11.5px;color:var(--t3);margin-top:2px}
.plan tr.done td{color:var(--t3)}.plan tr.done .act{text-decoration:line-through}
.planbar{display:flex;gap:8px;flex-wrap:wrap}
.allgood{border:1px dashed #cfe9de;background:#f6fbf9;border-radius:10px;padding:22px;color:var(--good);font-size:13.5px}
@media(max-width:900px){.sumrow{grid-template-columns:1fr 1fr 1fr}.sum.prio{grid-column:1/-1}.cards{grid-template-columns:1fr}}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,23,28,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;overflow:hidden}
.modal .img{height:220px;background:linear-gradient(160deg,#f6f6f7,#e5e6e8)}
.modal .in{padding:22px 24px}
.modal h4{font-size:18px;color:var(--strong)}
.modal .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.modal .grid b{display:block;font-size:20px;font-weight:500;color:var(--strong)}.modal .grid span{font-size:11px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}.grid2,.vs,.notes{grid-template-columns:1fr}.posts{grid-template-columns:1fr 1fr}.headline{grid-template-columns:1fr 1fr;row-gap:20px}.hl:nth-child(3){padding-left:0;border-left:0}.report-head{padding:24px 20px 100px}.report-head h1{font-size:30px}.hide-m{display:none}.rh-actions{justify-content:flex-start}.drpop{left:0;right:auto;grid-template-columns:1fr;width:min(320px,calc(100vw - 48px))}.presets{border-right:0;border-bottom:1px solid var(--line)}}
@media print{.viewbar .views,.ic-foot select,.planbar,.tabs,.rh-actions,.filter,.toast,.modal,.datastrip .acts,.drawer,.drawer-bg{display:none!important}.wrap{padding:0}section{padding-top:36px;break-inside:avoid}.panel,.stats,table,.posts{break-inside:avoid}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ---------- SEO tab ---------- */
.pg b{display:block;font-weight:600;color:var(--strong);font-size:14px}.pg small{font-size:12px;color:var(--t3)}
.mv{font-size:12px;font-weight:600;white-space:nowrap}.mv.up{color:var(--good)}.mv.down{color:var(--bad)}.mv.flat{color:var(--t3)}
.kwpos{font-size:18px;font-weight:500;color:var(--strong);font-variant-numeric:tabular-nums}
.kwname{font-weight:600;color:var(--strong)}
.kwurl{font-size:12px;color:var(--t2)}
.dist{margin-bottom:40px}
.dbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#ebecee;gap:2px}
.dbar i{display:block;height:100%;transition:width .3s}
.dleg{display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px}
.dleg div{padding:0 18px}.dleg div:first-child{padding-left:0}.dleg div+div{border-left:1px solid var(--line)}
.dleg span{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:7px}.dleg span i{width:8px;height:8px;border-radius:2px}
.dleg b{display:block;font-size:30px;font-weight:300;color:var(--strong);margin:6px 0 2px;letter-spacing:-.02em}
.dleg small{font-size:12px;color:var(--t2)}
.ring{display:flex;align-items:center;gap:26px}
.ring svg{width:112px;height:112px;flex-shrink:0}
.ring b{font-size:42px;font-weight:300;color:var(--strong);letter-spacing:-.02em}.ring b small{font-size:16px;color:var(--t2);margin-left:2px}
.ring p{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.5}
.idx{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--t2)}
.idx .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.idx b{color:var(--strong);font-weight:600}
.idxbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 10px;background:#ebecee;gap:2px}
.idxbar i{display:block;height:100%}
.cwv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0;border-top:1px solid var(--line)}
.cwv:first-of-type{border-top:0;padding-top:0}
.cwv .nm{font-size:14px;color:var(--strong);font-weight:600}.cwv .nm small{display:block;font-size:12px;color:var(--t2);font-weight:400;margin-top:3px}
.cwv .vl{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}.cwv .vl b{font-size:22px;font-weight:400;color:var(--strong)}
.kv .chg{display:block;font-size:12px;margin-top:3px;color:var(--t2)}
.kv .chg .up{color:var(--good);font-weight:600}.kv .chg .down{color:var(--bad);font-weight:600}
.sf{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.sf label{font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:5px}
.sf input{border:1px solid #e2e4e7;border-radius:6px;padding:8px 10px;font:500 13px Manrope,sans-serif;color:var(--strong)}
.sf input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.prio-pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px}
.prio-pill.bad{background:#fdf0eb;color:#c2522d}.prio-pill.warn{background:#fdf5e4;color:#a87213}.prio-pill.note{background:#f3f4f6;color:var(--t2)}
.await{border:1px dashed #dfe1e4;border-radius:12px;padding:26px 28px;background:var(--soft)}
.await h3{font-size:16px;font-weight:600;color:var(--strong)}.await>p{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.55}
.await ol{margin:14px 0 16px 18px;font-size:13px;color:var(--ink);line-height:1.7}
.await.sm{padding:18px 20px;margin-top:18px}.await.sm ol{margin-bottom:12px}
.stats.nostats{display:block;border-top:0}
.sf.three{grid-template-columns:1fr 1fr 1fr}
.db h5{font-size:12px;font-weight:600;color:var(--t2);margin:12px 0 8px}
tr.csel td{background:var(--accent-soft)!important}
.exbanner{margin-top:12px;padding:10px 14px;border-radius:10px;background:#fdf5e4;color:#8a5d0c;font-size:13px;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--t3)}
 .wk{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}.wk:first-child{border-top:0;padding-top:0}
.wd{font-size:12px;font-weight:600;color:var(--t2);padding-top:3px;line-height:1.4}
.wc{display:inline-block;font-size:11px;font-weight:600;color:var(--good);background:var(--accent-soft);padding:2px 7px;border-radius:4px}.wc.fix{color:var(--navy);background:#eef1f5}
.wb h4{font-size:14px;font-weight:600;color:var(--strong);margin:6px 0 3px;line-height:1.4}.wb p{font-size:12.5px;color:var(--t2);line-height:1.5}
.wb small{display:block;font-size:12px;color:var(--t3);margin-top:5px}.wb a{color:var(--navy);text-underline-offset:2px}
.nx{padding:14px 0;border-top:1px solid var(--line)}.nx:first-of-type{border-top:0;padding-top:0}
.nx b{display:block;font-size:13.5px;font-weight:600;color:var(--strong);line-height:1.4;margin-top:6px}.nx small{font-size:12px;color:var(--t2)}
.nx .bar{height:4px;background:#ebecee;border-radius:2px;margin-top:8px}.nx .bar i{display:block;height:100%;background:#c98a1b;border-radius:2px}
.nxh{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}.nxh:first-child{margin-top:0}
.morebtn{border:0;background:none;color:var(--navy);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;margin-top:14px}
.sf select,.sf textarea{border:1px solid #e2e4e7;border-radius:6px;padding:8px 10px;font:500 13px Manrope,sans-serif;color:var(--strong);background:#fff;resize:vertical}
.sf label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}.sf label.chk input{width:15px;height:15px;accent-color:var(--accent)}
.wl{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.wl b{font-weight:600;color:var(--strong)}.wl small{display:block;color:var(--t2);font-size:12px;margin-top:2px}.wl .r{display:flex;gap:6px;flex-shrink:0}
@media print{#sLogBtn{display:none}.rc{break-inside:avoid}}
.ressum{font-size:18px;line-height:1.5;color:var(--ink);margin:-8px 0 22px;max-width:820px}.ressum b{color:var(--good);font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rc{border:1px solid var(--line);border-top:3px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;background:#fff}
.rc .l{font-size:12.5px;color:var(--t2)}.rc .l small{color:var(--t3)}
.rc .v{font-size:30px;font-weight:300;color:var(--strong);letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.rc .w{font-size:12px;color:var(--t2)}.rc .d{margin-top:8px}
.rc.na .v{color:var(--t3);font-size:22px;margin:10px 0 4px}
.rc.up{border-top:3px solid var(--accent)}.rc.down{border-top:3px solid #c2522d}
@media(max-width:900px){.rgrid{grid-template-columns:1fr 1fr}.ressum{font-size:16px}.sf.three{grid-template-columns:1fr}.dleg{grid-template-columns:repeat(3,1fr);row-gap:20px}.dleg div:nth-child(4){padding-left:0;border-left:0}.sf{grid-template-columns:1fr}.ring{flex-direction:column;align-items:flex-start}}

/* ======================= shared helpers ======================= */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trim=v=>v.replace(/\.0+$/,'');
const fmt=n=>n>=999500?[(n/1e6).toFixed(2),'M']:n>=1e3?[trim((n/1e3).toFixed(n>=1e5?0:1)),'K']:[String(Math.round(n)),''];
const money=n=>'$'+Math.round(n).toLocaleString('en-AU');
const int=n=>Math.round(+n||0).toLocaleString('en-AU');
const pct=(a,b)=>(a-b)/b*100;
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mName=k=>{if(!k)return '';const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const mShort=k=>MONTHS[+k.slice(5)-1].slice(0,3);
const dObj=s=>new Date(String(s).slice(0,10)+'T00:00:00Z');
const dfmt=(s,o)=>dObj(s).toLocaleDateString('en-AU',Object.assign({timeZone:'UTC',day:'numeric',month:'short'},o||{}));
const fmtWhen=s=>new Date(s).toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const norm=u=>(u||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
const cssq=v=>String(v).replace(/["\\]/g,'\\$&');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);};
const stat=(l,v,u,c)=>`<div class="stat"><div class="l">${l}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div><div class="c">${c}</div></div>`;
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);};
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csvRows(text){return text.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>{const o=[];let cur='',qt=false;for(const ch of l){if(ch==='"'){qt=!qt;}else if(ch===','&&!qt){o.push(cur.trim());cur='';}else cur+=ch;}o.push(cur.trim());return o;});}
const hnorm=h=>h.toLowerCase().replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'');

/* ======================= bridge (the portal calls the API) ======================= */
let reqId=0;const pending=new Map();
addEventListener('message',e=>{const m=e.data;if(!m||!m.__rdr||e.source!==parent)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.ok?p.res(m.result):p.rej(new Error(m.error||'Something went wrong'));});
const bridge=(type,payload)=>new Promise((res,rej)=>{const id=++reqId;pending.set(id,{res,rej});parent.postMessage({__rd:true,id,type,payload},'*');});

function renderResults(P,M,B,fallbackDate){let up=0;const best=[];B=B||{date:'',v:{}};
 const baseOf=m=>m.base!=null?m.base:(B.v&&B.v[m.k]!=null&&B.v[m.k]!==''?+B.v[m.k]:null),bdateOf=m=>m.bdate||B.date||fallbackDate;
 $(P+'Res').innerHTML=M.map(m=>{const c=m.cur(),b=baseOf(m),bd=bdateOf(m)?dfmt(bdateOf(m),{year:'numeric'}):'';
  if(c==null)return `<div class="rc na"><div class="l">${m.l}${m.u?` <small>· ${m.u}</small>`:''}</div><div class="v">Not entered yet</div><div class="w">${b!=null?'Was '+m.f(b)+(bd?' on '+bd:''):'Needs '+m.src}</div></div>`;
  let chg='',cls='';if(b!=null){const diff=c-b,good=m.dir*diff>0,bad=m.dir*diff<0;if(good&&!m.nc){up++;best.push(m.sl||m.l.toLowerCase());}cls=good?'up':bad?'down':'';
   const t=Math.abs(diff)<(m.dp?0.05:0.5)?'No change':m.pct&&b>0?(diff>0?'+':'')+pct(c,b).toFixed(0)+'%':m.k==='pos'?(diff<0?'▲ ':'▼ ')+Math.abs(diff).toFixed(1)+(diff<0?' places higher':' places lower'):(diff>0?'+':'−')+(m.dp?Math.abs(diff).toFixed(m.dp):int(Math.abs(diff)))+(m.unit?' '+m.unit:'');
   chg=`<div class="d"><span class="chip ${good?'good':bad?'bad':'neu'}">${t}</span></div>`;}
  return `<div class="rc ${cls}"><div class="l">${m.l}${m.u?` <small>· ${m.u}</small>`:''}</div><div class="v">${m.f(c)}</div><div class="w">${b!=null?'Was '+m.f(b)+(bd?' on '+bd:''):'Starting point not recorded'}</div>${chg}</div>`;}).join('');
 const since=B.date||fallbackDate;
 $(P+'ResSum').innerHTML=up?`Since ${dfmt(since,{year:'numeric'})}, <b>${up} measure${up>1?'s have':' has'} improved</b>${best.length?', including '+esc(best.slice(0,3).join(', '))+'.':'.'}`:since?`The starting point was recorded on ${dfmt(since,{year:'numeric'})}. The comparison fills in as work is completed and figures are entered.`:'Record a starting point in Update data to show before and after.';

function drawLine(id,vals,labels,o){const W=700,H=230,n=vals.length,all=vals.filter(v=>v!=null);if(!all.length){$(id).innerHTML='';return;}let lo,hi;
 if(o.inv){lo=Math.max(1,Math.floor(Math.min(...all)));hi=Math.ceil(Math.max(...all));if(hi-lo<4)hi=lo+4;}
 else{lo=0;const top=Math.max(...all)||1,st=Math.pow(10,Math.floor(Math.log10(top/4||1)));hi=Math.ceil(top/4/st)*st*4||1;}

function buildDrawer(){const c=cfg(),B=D.base||{date:'',v:{}},N=D.notes||{};
 $('dt_client').innerHTML=`<h4>Client</h4><div class="sf"><label>Client name<input type="text" id="azfClient" value="${esc(c.client)}" placeholder="${esc(S.customerName||'')}"></label><label>Website (optional)<input type="text" id="azfSite" value="${esc(c.site)}"></label></div>
  <h4>Targets</h4><div class="sf">${fld('Availability target (%)','id="azfUp"',c.tUp)}${fld('Secure Score target (%)','id="azfScore"',c.tScore)}${fld('Backup success target (%)','id="azfBk"',c.tBackup)}${fld('Patch compliance target (%)','id="azfPatch"',c.tPatch)}</div>
  <h4>Account manager summary</h4><div class="sf"><label style="grid-column:1/-1">Summary of the month<textarea id="nText" rows="4">${esc(N.text||'')}</textarea></label>${[0,1,2].map(i=>`<label style="grid-column:1/-1">Next step ${i+1}<input type="text" data-nstep="${i}" value="${esc((N.items||[])[i]||'')}"></label>`).join('')}</div>`;
 $('dt_month').innerHTML=`<h4>Month</h4><div class="sf"><label>Month these figures are for<input type="month" id="azfMonth" value="${CUR}"></label><span></span></div><h4>Figures</h4><div id="azfMonthFields">${monthFields(CUR)}</div>
  <h4>Starting point (before EG Eloma's work)</h4><p class="hint" style="margin:0 0 12px">Figures from before the work began, so the report shows before and after.</p>
  <div class="sf"><label>Date of starting point<input type="date" id="azbDate" value="${esc(B.date||'')}"></label><span></span>${CRM.map(m=>fld(m.l+(m.u?' ('+m.u+')':''),`data-bf="${m.k}"`,(B.v||{})[m.k])).join('')}</div>
  <button class="btn outline sm" id="azbCopy" type="button" style="margin-top:12px">Use ${mName(CUR)}'s figures as the starting point</button>`;
 $('dt_res').innerHTML=`<label class="drop" id="azResDrop"><b>Drop a resources CSV here</b>or click to choose a file<input type="file" id="azResFile" accept=".csv,text/csv" hidden></label><div class="tpl"><button class="btn outline sm" id="azResTpl" type="button">Download resources template</button></div><div class="msg" id="azResMsg"></div>
  <p class="hint">Columns: name, type, size, cpu_avg, cpu_peak, memory, disk, monthly_cost (percentages as numbers). Use 30-day averages from Azure Monitor. Uploading replaces the list.</p><h4>Current resources</h4><div id="azResList"></div>`;
 $('dt_rec').innerHTML=`<label class="drop" id="azRecDrop"><b>Drop an Azure Advisor CSV here</b>or click to choose a file<input type="file" id="azRecFile" accept=".csv,text/csv" hidden></label><div class="msg" id="azRecMsg"></div>
  <p class="hint">Recognised columns: Category, Business Impact (or Impact), Recommendation, Impacted resource (or Resource), Potential annual savings or monthly saving. New rows are added; existing ones keep their status.</p>
  <h4>Add a recommendation</h4><div class="sf"><label style="grid-column:1/-1">Recommendation<input type="text" id="azRecTitle" placeholder="e.g. Right-size a virtual machine"></label><label>Category<select id="azRecCat">${RCAT.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Impact<select id="azRecImp"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>Resource<input type="text" id="azRecRes"></label>${fld('Saving a month ($)','id="azRecSave"','')}</div>
  <button class="btn primary sm" id="azRecAdd" type="button" style="margin-top:12px">Add recommendation</button><h4>Recommendations</h4><div id="azRecList"></div>`;
 $('dt_inc').innerHTML=`<h4>Add an incident</h4><div class="sf"><label>Date<input type="date" id="azIncDate" value="${S.today}"></label>${fld('Duration (minutes)','id="azIncDur"','')}<label style="grid-column:1/-1">What happened<input type="text" id="azIncTitle" placeholder="e.g. CRM slow for 35 minutes"></label><label>Resource<input type="text" id="azIncRes"></label><label>Cause<input type="text" id="azIncCause"></label><label class="chk" style="grid-column:1/-1"><input type="checkbox" id="azIncProv"> Caused by the cloud provider (not in our control)</label></div>
  <button class="btn primary sm" id="azIncAdd" type="button" style="margin-top:12px">Add incident</button><h4>Incidents</h4><div id="azIncList"></div>`;
 $('dt_log').innerHTML=logTab(CWCAT,['e.g. Patched 6 servers and rebooted out of hours','e.g. All security updates installed; reboots done Saturday night.']);
 lists2();wListRender();
 readFile('azResFile','azResDrop',(rows,name)=>{if(rows.length<2)throw new Error('The file has no data rows.');const h=rows[0].map(hnorm),ci=a=>h.findIndex(x=>a.includes(x));
  const map={name:ci(['name','resource','resource_name']),type:ci(['type','resource_type']),size:ci(['size','sku','tier']),cpu_avg:ci(['cpu_avg','cpu','avg_cpu','cpu_average','average_cpu']),cpu_peak:ci(['cpu_peak','max_cpu','peak_cpu','cpu_max']),memory:ci(['memory','memory_avg','mem','memory_percent']),disk:ci(['disk','disk_used','disk_percent']),monthly_cost:ci(['monthly_cost','cost','cost_month'])};
  if(map.name<0)throw new Error('Add a "name" column.');const list=rows.slice(1).filter(r=>r[map.name]).map(r=>{const o={};Object.entries(map).forEach(([k,i])=>o[k]=i>=0?(['name','type','size'].includes(k)?r[i]:(r[i]===''?'':+String(r[i]).replace(/[%$,\s]/g,''))):'');return o;});
  persistList({res:list},null,'resources CSV ('+name+')').then(ok=>{if(ok){$('azResMsg').className='msg ok';$('azResMsg').textContent=`Loaded ${list.length} resources from ${name}.`;lists2();}});},'azResMsg');
 readFile('azRecFile','azRecDrop',(rows,name)=>{if(rows.length<2)throw new Error('The file has no data rows.');const h=rows[0].map(hnorm),ci=a=>h.findIndex(x=>a.includes(x));
  const ti=ci(['recommendation','description','problem','short_description','title']),ca=ci(['category']),im=ci(['business_impact','impact']),re=ci(['impacted_resource','resource','resource_name','impacted_value']),an=ci(['potential_annual_savings','annual_savings','potential_annual_cost_savings']),mo=ci(['monthly_saving','monthly_savings','saving_a_month','savings']);
  if(ti<0)throw new Error('Add a "Recommendation" column.');const list=[...recs()];let k=0;
  rows.slice(1).forEach(r=>{const t=r[ti];if(!t)return;const rs=re>=0?r[re]:'';if(list.some(q=>q.title===t&&q.res===rs))return;let cat=ca>=0?r[ca]:'Other';cat=RCAT.find(x=>x.toLowerCase().replace(/\s/g,'')===String(cat).toLowerCase().replace(/[\s_]/g,''))||(/cost/i.test(cat)?'Cost':/secur/i.test(cat)?'Security':/avail|reliab|high/i.test(cat)?'Reliability':/perf/i.test(cat)?'Performance':'Operational excellence');
   const imp=im>=0&&/high/i.test(r[im])?'High':im>=0&&/low/i.test(r[im])?'Low':'Medium',sv=mo>=0?+String(r[mo]).replace(/[$,\s]/g,''):an>=0?+String(r[an]).replace(/[$,\s]/g,'')/12:0;
   list.push({id:uid('r'),title:t,cat,imp,res:rs,save:isNaN(sv)?0:Math.round(sv),st:'Open',done:null});k++;});
  persistList({recs:list},null,'recommendations CSV ('+name+')').then(ok=>{if(ok){$('azRecMsg').className='msg ok';$('azRecMsg').textContent=`Added ${k} recommendation${k===1?'':'s'} from ${name}.`;lists2();}});},'azRecMsg');}
function lists2(){
 $('azResList').innerHTML=res().map((r,i)=>`<div class="wl"><div><b>${esc(r.name)}</b><small>${esc(r.type||'')} ${esc(r.size||'')} · CPU ${r.cpu_avg!==''&&r.cpu_avg!=null?r.cpu_avg:'–'}% · ${resStatus(r)[1]}</small></div><div class="r"><button class="btn outline sm" type="button" data-adelres="${i}">Delete</button></div></div>`).join('')||'<p class="goalnote">No resources yet.</p>';
 $('azRecList').innerHTML=recs().map(r=>`<div class="wl"><div><b>${esc(r.title)}</b><small>${esc(r.cat)} · ${esc(r.imp)}${r.res?' · '+esc(r.res):''}${+r.save?' · '+money(r.save)+'/mo':''}</small></div><div class="r"><select data-arst="${esc(r.id)}" style="border:1px solid #e2e4e7;border-radius:6px;padding:6px;font:500 12.5px Manrope,sans-serif">${['Open','In progress','Done'].map(o=>`<option ${o===r.st?'selected':''}>${o}</option>`).join('')}</select><button class="btn outline sm" type="button" data-adelrec="${esc(r.id)}">Delete</button></div></div>`).join('')||'<p class="goalnote">No recommendations yet.</p>';
 $('azIncList').innerHTML=inc().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="wl"><div><b>${esc(x.title)}</b><small>${dfmt(x.date,{year:'numeric'})} · ${int(+x.dur||0)} min${x.res?' · '+esc(x.res):''}</small></div><div class="r"><button class="btn outline sm" type="button" data-adelinc="${esc(x.id)}">Delete</button></div></div>`).join('')||'<p class="goalnote">No incidents recorded.</p>';}
function collect(){const dr=$('drawer'),bad=[...dr.querySelectorAll('input[type=number]')].find(i=>i.value!==''&&(isNaN(+i.value)||+i.value<0));if(bad){bad.focus();return 'Numbers must be 0 or more';}
 const patch={},c={...cfg()};c.client=$('azfClient').value.trim();c.site=$('azfSite').value.trim();[['tUp','azfUp'],['tScore','azfScore'],['tBackup','azfBk'],['tPatch','azfPatch']].forEach(([k,id])=>{if($(id).value!=='')c[k]=+$(id).value;});patch.cfg=c;
 patch.notes={text:$('nText').value.trim(),items:[...dr.querySelectorAll('[data-nstep]')].map(i=>i.value.trim())};
 const mk=$('azfMonth').value;if(mk){const r={...(months()[mk]||{})};dr.querySelectorAll('input[data-mf]').forEach(i=>{if(i.value==='')delete r[i.dataset.mf];else r[i.dataset.mf]=+i.value;});
  if(r.uptime!=null&&r.uptime>100)return 'Availability must be 100% or less';if(r.bfail!=null&&r.bjobs!=null&&r.bfail>r.bjobs)return 'Failed jobs can\'t be more than jobs run';
  const svc={};let badLine='';lines($('azfSvc').value).forEach(l=>{const i=l.lastIndexOf(','),k=l.slice(0,i).trim(),v=+l.slice(i+1).replace(/[$\s,]/g,'');if(i<1||isNaN(v))badLine=l;else svc[k]=v;});if(badLine)return 'Check this cost line: '+badLine;
  if(Object.keys(svc).length){r.svc=svc;if(r.cost==null)r.cost=Object.values(svc).reduce((a,b)=>a+b,0);}else delete r.svc;
  const all={...months()};if(Object.keys(r).length)all[mk]=r;else delete all[mk];patch.months=all;}
 const bv={};dr.querySelectorAll('input[data-bf]').forEach(i=>{if(i.value!=='')bv[i.dataset.bf]=+i.value;});patch.base={date:$('azbDate').value||(Object.keys(bv).length?S.today:''),v:bv};
 return patch;}
function click(e){const t=e.target,g=a=>t.closest(`[${a}]`);let x;
 if(x=t.closest('#azOptFilter button')){optF=x.dataset.f;opt();return;}
 if(t.id==='azbCopy'){let k=0;CRM.forEach(m=>{const v=m.cur(),i=document.querySelector(`#drawer input[data-bf="${m.k}"]`);if(v!=null&&i){i.value=+(+v).toFixed(m.dp||0);k++;}});$('azbDate').value=CUR+'-01';toast(k?'Copied '+k+' figures. Click Save and refresh to keep them':'No figures entered for '+mName(CUR)+' yet');return;}
 if(t.id==='azResTpl'){dl('azure-resources-template.csv','name,type,size,cpu_avg,cpu_peak,memory,disk,monthly_cost\n'+res().map(r=>[r.name,r.type,r.size,r.cpu_avg,r.cpu_peak,r.memory,r.disk,r.monthly_cost].map(v=>/[",]/.test(String(v??''))?csvq(v):v??'').join(',')).join('\n'));return;}
 if(t.id==='azRecAdd'){const ti=$('azRecTitle').value.trim();if(!ti){$('azRecTitle').focus();toast('Describe the recommendation');return;}
  persistList({recs:[...recs(),{id:uid('r'),title:ti,cat:$('azRecCat').value,imp:$('azRecImp').value,res:$('azRecRes').value.trim(),save:num($('azRecSave').value)||0,st:'Open',done:null}]},'Recommendation added','recommendations').then(ok=>{if(ok){['azRecTitle','azRecRes','azRecSave'].forEach(i=>$(i).value='');lists2();}});return;}
 if(t.id==='azIncAdd'){const ti=$('azIncTitle').value.trim(),d=$('azIncDate').value;if(!ti||!d){toast('Add the date and what happened');return;}
  persistList({inc:[...inc(),{id:uid('i'),date:d,title:ti,dur:num($('azIncDur').value)||0,res:$('azIncRes').value.trim(),cause:$('azIncCause').value.trim(),prov:$('azIncProv').checked}]},'Incident added','incidents').then(ok=>{if(ok){['azIncTitle','azIncDur','azIncRes','azIncCause'].forEach(i=>$(i).value='');$('azIncProv').checked=false;lists2();}});return;}
 if(x=g('data-adelres')){const list=res().filter((_,i)=>i!==+x.dataset.adelres);persistList({res:list},'Resource deleted').then(ok=>ok&&lists2());return;}
 if(x=g('data-adelrec')){if(!confirm('Delete this recommendation?'))return;persistList({recs:recs().filter(r=>r.id!==x.dataset.adelrec)},'Recommendation deleted').then(ok=>ok&&lists2());return;}
 if(x=g('data-adelinc')){if(!confirm('Delete this incident?'))return;persistList({inc:inc().filter(r=>r.id!==x.dataset.adelinc)},'Incident deleted').then(ok=>ok&&lists2());return;}}
function change(e){const t=e.target;if(t.id==='azfMonth'&&t.value){$('azfMonthFields').innerHTML=monthFields(t.value);return;}
 const s=t.closest&&t.closest('[data-arst]');if(s){const list=recs().map(r=>r.id===s.dataset.arst?{...r,st:s.value,done:s.value==='Done'?S.today:null}:r);persistList({recs:list},'Status updated','recommendations').then(ok=>ok&&lists2());}}
return{kind:'azure',P,planName:'Azure action plan',layout,render,buildDrawer,collect,click,change,ins:()=>INS};})();

/* ======================= start ======================= */
const MODS={seo:SEO,local:LOC,azure:AZR};
function render(){if(!K)return;K.render();dataStrip();monthSelect();}
function monthSelect(){const sel=$('monthSel');if(!sel)return;const ks=new Set(enteredMonths());ks.add(todayKey());ks.add(CUR);
 (K.extraMonths?K.extraMonths():[]).forEach(k=>ks.add(k));const L=[...ks].filter(Boolean).sort().reverse();
 sel.innerHTML=L.map(k=>`<option value="${k}" ${k===CUR?'selected':''}>${mName(k)}${hasMonth(k)?'':' (no figures)'}</option>`).join('');}
function applyPayload(r){S=r;D=r.data&&typeof r.data==='object'?r.data:{};IST=D.insights&&typeof D.insights==='object'?D.insights:(D.insights={});}
async function reload(){applyPayload(await bridge('load'));render();}
async function boot(){try{applyPayload(await bridge('load'));}catch(e){$('root').innerHTML=`<div class="await" style="margin-top:20px"><h3>Could not load the report</h3><p>${esc(e.message)}</p></div>`;return;}
 K=MODS[S.kind];if(!K){$('root').innerHTML='<div class="await"><h3>Unknown report</h3></div>';return;}
 document.title=({seo:'SEO Dashboard',local:'Local Listing',azure:'Azure Performance'})[S.kind]+' · EG Eloma';
 const ms=enteredMonths().filter(k=>k<=todayKey());CUR=ms.length?ms[ms.length-1]:todayKey();
 const html=K.layout(),drawerAt=html.indexOf('<aside class="drawer"');
 $('root').innerHTML=drawerAt>0?html.slice(0,drawerAt):html;
 if(drawerAt>0&&staff())$('drawerHost').innerHTML=html.slice(drawerAt);
 document.body.classList.toggle('client',!staff());
 document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
 render();}
boot();

</script>
